server {
    listen 80;
    listen [::]:80;
    server_name neostoreofficial.store www.neostoreofficial.store 13.205.126.70;

    client_max_body_size 20M;

    # Serve React Vite Frontend (SPA)
    location / {
        root /home/ubuntu/WoexStore_V2/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests to Node.js Backend (Port 8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve backend uploaded images
    location /uploads/ {
        alias /home/ubuntu/WoexStore_V2/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
